[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/assets",
    "crates/config",
    "crates/api",
    "crates/cli",
    "crates/client",
    "crates/edit",
    "crates/mangos",
    "crates/editor",
]
# `cargo run` / `cargo build` from the repo root act on the CLI, so the common
# case stays a bare `cargo run` rather than `cargo run -p vale-cli`.
default-members = ["crates/cli"]
# Patched third-party crates, used through `[patch.crates-io]` at the end of
# this file. Excluded so that `cargo test --workspace` does not build their
# tests as this workspace's own.
exclude = ["vendor"]

# Shared metadata and dependency versions. Member crates refer to these with
# `x.workspace = true` so a version bump happens in exactly one place.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
vale-protocol = { path = "crates/protocol" }
vale-assets = { path = "crates/assets" }
vale-config = { path = "crates/config" }
# The renderer's API surface as plain data, so the CLI can report on it without
# linking the renderer. See `crates/api/src/lib.rs` for why it is its own crate.
vale-api = { path = "crates/api" }
# The world editor's own two crates. `edit` is the editing model and has no
# renderer in it; `editor` is the separate binary that draws one. Neither is a
# dependency of the client, and the client is not built by a bare `cargo build`
# of them — see crates/edit/src/lib.rs.
vale-edit = { path = "crates/edit" }
vale-mangos = { path = "crates/mangos" }
vale-client = { path = "crates/client" }

# --- protocol ---
num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
rand = "0.8"
# SMSG_COMPRESSED_UPDATE_OBJECT is a zlib stream prefixed with its inflated size.
flate2 = "1"

# --- assets ---
# MPQ container handling (encryption, hash/block tables, PKWARE implode) comes
# from a crate. The WoW-specific formats layered on top (WDT/ADT/DBC) are
# written in `crates/assets`.
wow-mpq = "0.7"
# The game ships its four typefaces as plain TrueType and lays the interface out
# in them, so `crates/assets` measures a word with the same font data the
# painter draws with. The crate is already in the dependency tree under the
# renderer, so parsing `hmtx` by hand would duplicate it.
ttf-parser = "0.25"
# The rasteriser behind the world-space labels. `epaint` depends on the same
# 0.2, so this adds no new build. `ttf-parser` above measures outlines but
# cannot fill them; a name drawn in the world needs a texture per name, and a
# hand-written scanline fill over quadratic and cubic curves would have to
# handle self-intersecting contours. See `client::render::labels`.
ab_glyph = "0.2"

# --- client (Bevy renderer) ---
# The renderer runs in-process with the asset and protocol crates, so the pose
# maths, the vertex arrays and the world snapshot do not cross an IPC boundary.
# See crates/client/src/lib.rs.
# `wav` and `mp3` on top of the defaults, because those are the two formats the
# 1.12 archives hold: `vale sound` measured 8,668 WAVs (every readable one
# plain PCM) and 291 MP3s (the music).
bevy = { version = "0.19", features = ["wav", "mp3"] }
# The same decoder Bevy plays through, decode-only (no `playback`, so the CLI
# builds no audio backend). `bevy_audio` unwraps its decoder: a file rodio
# cannot decode panics the whole app from inside `play_queued_audio_system`.
# So the mixer probes every file before Bevy sees it, and `vale sound` probes
# all 8,961 in the archives. Pinned to bevy_audio's own version, so the probe
# and the player decode the same way.
rodio = { version = "0.22.2", default-features = false, features = ["wav", "mp3"] }
# The world database, for `crates/mangos`: a spell edit becomes a row in
# vmangos' `spell_template`. Pure Rust, so no MySQL client library is needed
# on the machine, with the default features minus the TLS stack and the
# compression, which a connection to a local dev server does not use. It is
# not behind a Cargo feature: a second build configuration would be a second
# thing to keep working, and whether a database is reachable is decided at run
# time.
mysql = { version = "26", default-features = false, features = ["minimal"] }
# 0.41 is the release that targets Bevy 0.19; the two are versioned in lockstep,
# so bumping one means bumping the other.
# `default-features = false`: the defaults pull `bevy_ui` and `picking`, and
# through them `bevy_ui_render`, `bevy_ui_widgets` and `bevy_text`, five plugin
# families this client does not use (its interface is FrameXML drawn by its own
# mesh painter, with egui kept for the debug window, and its picking is
# `game::combat::target`'s own). The 2026-08 system census counted ~75 of the
# frame's ~757 system runs in them. What is kept is what the client uses: the
# renderer, the clipboard (the chat line pastes), `open_url` and egui's own
# fonts.
bevy_egui = { version = "0.41", default-features = false, features = [
    "manage_clipboard",
    "open_url",
    "default_fonts",
    "render",
] }
# The window system's clipboard, for `Interface\FrameXML\`'s edit boxes.
# egui-winit already pulls the same 3.x for its own text fields, so this adds
# no new build; the alternative is `OpenClipboard`/`GlobalLock` by hand on three
# platforms. See `crates/client/src/lua/keyboard.rs`, the only caller.
arboard = "3"
# Lua 5.1, the version 1.12 embeds, not 5.2 and not LuaJIT. FrameXML and every
# 1.12 addon are written against 5.1's semantics (`setfenv`, `arg`,
# `table.getn`, numbers without an integer type), and a 5.2+ host runs most of
# them and silently breaks the rest.
#
# `vendored` builds the interpreter from source with `cc` instead of looking
# for a system Lua, so a machine with no Lua installed builds it with a normal
# `cargo build`. It is ~20k lines of C and adds a few seconds to a cold build.
mlua = { version = "0.11", features = ["lua51", "vendored"] }

# --- shared ---
thiserror = "2"

[profile.release]
opt-level = 3

# Bevy pulls in ~500 crates, and a debug build with full DWARF over that many
# produces a `target/debug` in the tens of gigabytes, enough to fill a disk and
# fail the build with `no space on device`. Line tables keep panic backtraces
# and profiler symbols, the two things this project reads, and drop the
# variable and type debug info that is nearly all of the size.
#
# Raise this to `true` to step through Bevy internals in a debugger.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimised even in a debug build: terrain parsing (thousands
# of chunks per tile) is too slow otherwise.
#
# They also run without debug assertions or overflow checks, which `opt-level`
# does not turn off. The dev profile enables both for everything it builds, so
# with only `opt-level = 2` the ~500 dependency crates (Bevy, wgpu, naga, glam)
# still checked every arithmetic operation for overflow and ran every
# `debug_assert!` Bevy ships, in code that runs every frame.
#
# This override is for dependencies only. Bevy's debug assertions check Bevy's
# own invariants, and none has fired against this repository's use of Bevy;
# `vale-assets` and `vale-protocol` keep theirs, because their arithmetic is
# this project's own and an overflow there would be a real bug.
#
# Turn them back on (delete the two lines) when a fault looks like it is inside
# Bevy or wgpu rather than in this client's use of them.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

# The same optimisation for the two crates that do this project's own
# arithmetic.
#
# The renderer is run as a debug build, so the debug build is the one whose
# speed matters. These two crates carry the per-frame cost that is not Bevy's
# (`M2Skeleton::pose` samples three tracks per bone per entity per frame) and
# everything a tile load does (ADT meshing, BLP decode, M2 parsing). Measured:
# `vale anim` parses and poses the whole bestiary, 411 models and 768
# animations at four phases each, in 13.2 s unoptimised against 3.7 s at 2,
# including the archive reads, which were already optimised; the pose maths on
# its own gains more than 3.6x.
#
# `vale-client` is not in this list; see its own section below.
[profile.dev.package.vale-assets]
opt-level = 2

[profile.dev.package.vale-protocol]
opt-level = 2

# `vale-client` at opt-level 2. It was at 0 so that a debugger could step
# through it, on the grounds that it had no inner loops; it now has some (the
# HUD's scan of every mesh in the world, the screenshot dump's), and the frame
# is CPU-bound. Measured 2026-07 at one framing: 17.0 ms at 0 against 14.5 ms
# at 2 (one run each, with ±2.5 ms run-to-run variation, so the size is
# approximate and the direction is reliable). Comment this out to use a
# debugger on the `vale-client` crate.
[profile.dev.package.vale-client]
opt-level = 2

# `wgpu-hal` 29.0.4, unmodified except for one change in
# `src/vulkan/swapchain/native.rs` (search for "Vale patch").
#
# After `vkAcquireNextImageKHR`, upstream waits on a CPU fence until the
# acquired image is fully released (gfx-rs/wgpu#8310, #8354). On Windows with a
# DXGI-backed Vulkan swapchain that blocks the render thread until the GPU has
# finished the previous frame, so the render thread's work and the GPU's add
# instead of overlapping. The patch skips that wait unless `VALE_ACQUIRE_WAIT`
# is set. Measured on an RX 6900 XT at 3440x1440, vsync on: 93 fps with the
# wait, about 139 without; with vsync off, 11.0 ms median frames against 6.9.
#
# The copy must track the `wgpu-hal` version Bevy uses: on a Bevy or wgpu
# upgrade, re-copy the new version from the registry and re-apply the change,
# or delete this section if upstream has made the wait optional.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
