[package]
name = "vale-edit"
description = "What an edit to the game's own files is, and how it is written back. No renderer, no window."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "vale_edit"
path = "src/lib.rs"

[dependencies]
# The file formats and the coordinate conventions. This crate writes the files
# `vale-assets` reads, and takes every rule about what they mean from there:
# the vertex layout of a map chunk, the tile grid, the world axes. A second
# reading of any of those is how an editor moves a doodad a unit off the ground
# the client walks on.
vale-assets.workspace = true
# Publishing a project as a patch archive. The same crate the chain is read
# through, so what the editor writes and what the client reads cannot drift.
wow-mpq.workspace = true
thiserror.workspace = true
# Reading a glTF 2.0 file for `src/m2/gltf.rs`: models with skeletons and
# animations, made in any tool that exports the format. The version and the
# features are the ones Bevy's own glTF loader already builds, so this adds no
# new build of it; `base64` is the version Bevy's loader uses too, for a
# buffer embedded in the JSON as a `data:` URI.
gltf = { version = "1.4", default-features = false, features = ["names", "utils", "KHR_materials_unlit"] }
base64 = "0.22"
# rodio with only its WAV and MP3 decoders, as the workspace declares it, for
# reading a WAV or MP3 in `src/sound.rs`. The client crate plays through the
# same decoder, so a sound this crate writes is one the client crate can play.
rodio.workspace = true
