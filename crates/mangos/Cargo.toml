[package]
name = "vale-mangos"
description = "What a row of the server's world means, and the statements that change one."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "vale_mangos"
path = "src/lib.rs"

[dependencies]
# The editable DBC, which a row is written from: an edit is a `Spell.dbc` this
# project changed, and the statement is the difference between that and the
# shipped file. `vale-edit` has no renderer or window dependency, which is why
# it is a separate crate.
vale-edit.workspace = true
# The database connection, the only part of this crate that talks to another
# process. See `conn.rs` for why it is not behind a feature.
mysql.workspace = true
