[package]
name = "vale-config"
description = "Reads the install folder the way 5875 does: realmlist.wtf, WTF/Config.wtf, Data/."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `realmlist.wtf` and `Config.wtf` are one format with one reader, and that
# reader is in `assets` because it is a *format* — decidable with no renderer
# and no socket. This crate is the folder-shaped half of the same question:
# which files, which CVars, which fallbacks. See
# `vale_assets::interface::wtf`.
vale-assets.workspace = true
