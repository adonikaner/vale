[package]
name = "vale-collab"
description = "A shared editing session: the messages between editors, the host's ordering of their edits, and the connections that carry them."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "vale_collab"
path = "src/lib.rs"

[dependencies]
# The edits a session carries are `vale_edit::undo::Change`, the undo stack's
# own entries, so a shared edit and an undone edit are one value.
vale-edit.workspace = true
serde.workspace = true
# The encoding of one message on the wire: compact, and the field order is the
# type's declaration order, so both ends must be the same build of this crate.
# `Hello` carries `PROTOCOL` for that reason.
postcard = { version = "1", default-features = false, features = ["use-std"] }
# The password check. Already in the dependency tree.
blake3 = "1"
# The challenge a joining editor answers, and a new log's id.
rand.workspace = true
# The log's payloads are deflated: a terrain edit is whole chunk states, and
# a day of edits is otherwise hundreds of megabytes. A frame on the
# connection is deflated too.
flate2.workspace = true
# The connection's key exchange: one ephemeral X25519 key per side.
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# The connection's encryption of each frame.
chacha20poly1305 = "0.10.1"
